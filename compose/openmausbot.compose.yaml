services:
  openmausbot:
    image: ghcr.io/milind-soni/openmausbot:latest
    container_name: openmausbot
    restart: unless-stopped
    ports:
      - "8799:8799"
    volumes:
      - /mnt/user/appdata/openmausbot:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PUBLIC_URL=http://localhost:8799
      - TZ=UTC
